name: novel_app
description: "Android 端小说阅读 APP - 支持本地导入、书源管理、书架管理、在线阅读、听书等功能"
publish_to: 'none'

version: 4.1.32+71

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.4
  flutter_secure_storage: 9.2.4
  sqflite: ^2.4.2
  path: ^1.9.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  path_provider: ^2.1.5
  flutter_tts: ^4.2.2
  file_picker: ^8.1.7
  uuid: ^4.5.1
  crypto: ^3.0.7
  encrypt: ^5.0.3
  audioplayers: ^6.7.1
  web_socket_channel: ^3.0.3
  page_flip: ^0.2.5+1
  # Pinned because android/audio_service_patch replaces one 0.18.18 class for
  # OriginOS media-card compact action compatibility.
  audio_service: 0.18.18
  audio_session: ^0.2.3
  wakelock_plus: ^1.5.2
  permission_handler: ^12.0.3
  package_info_plus: ^9.0.1
  html: ^0.15.6
  video_player: ^2.11.1
  chewie: ^1.13.1
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_android_video:
    path: vendor/media_kit_libs_android_video
  extended_image: ^10.0.1
  flutter_svg: ^2.2.3
  canvas_danmaku: ^0.3.1
  flutter_chat_ui: ^2.11.1
  flutter_chat_core: ^2.9.0
  record: ^7.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Kept below 2.4: sqlite3 3.x native-asset hooks run during Android builds
  # even for dev dependencies and require an external GitHub binary download.
  sqflite_common_ffi: 2.3.6
  sqlite3: 2.7.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/app_icon.png
    - assets/images/profile/
    - assets/images/chat_bot/
    - assets/stickers/chat/
    - assets/books/default/
    - assets/fonts/licenses/
  fonts:
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.otf
    - family: LXGWWenKaiScreen
      fonts:
        - asset: assets/fonts/LXGWWenKaiGBScreen.ttf
