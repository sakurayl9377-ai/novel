# Include this file inside the existing server block for 49.232.137.85.
# The Go login HTTP sidecar is loopback-only; expose only these app endpoints.

# The existing general /novel-api/ proxy must not make Go-only SSO operations
# public. They return credentials when called with a shared server secret, so
# the Node and Go services use 127.0.0.1:3010 directly instead.
location = /novel-api/games/kdjx/sessions/verify {
    return 404;
}

location = /novel-api/games/kdjx/sessions/verify/ {
    return 404;
}

# The APK injects these owned URLs. Keep support and privacy self-contained so
# they never redirect to a legacy vendor; telemetry is deliberately a no-op.
location = /games/kdjx/support {
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    return 200 '<!doctype html><html><head><meta charset="utf-8"><title>Sakura Support</title></head><body><h1>Sakura Support</h1><p>Please contact support through the Sakura app.</p></body></html>';
}

location = /games/kdjx/support/ {
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    return 200 '<!doctype html><html><head><meta charset="utf-8"><title>Sakura Support</title></head><body><h1>Sakura Support</h1><p>Please contact support through the Sakura app.</p></body></html>';
}

location = /games/kdjx/privacy {
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    return 200 '<!doctype html><html><head><meta charset="utf-8"><title>Sakura Privacy</title></head><body><h1>Sakura Privacy</h1><p>Sakura processes only the information required to provide this game service and its account authorization.</p></body></html>';
}

location = /games/kdjx/privacy/ {
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    return 200 '<!doctype html><html><head><meta charset="utf-8"><title>Sakura Privacy</title></head><body><h1>Sakura Privacy</h1><p>Sakura processes only the information required to provide this game service and its account authorization.</p></body></html>';
}

location = /games/kdjx/telemetry {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 204;
}

location ^~ /games/kdjx/telemetry/ {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 204;
}

location = /kdjx/version {
    proxy_pass http://127.0.0.1:18080/version;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}

location = /kdjx/notice {
    proxy_pass http://127.0.0.1:18080/notice;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}

location = /kdjx/servers {
    proxy_pass http://127.0.0.1:18080/servers;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}

# The Sakura client keeps these legacy telemetry/word-filter endpoints. They
# are deliberately acknowledged locally and never forwarded to an old vendor.
location = /kdjx/report {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 204;
}

location = /kdjx/word-check {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 204;
}

location = /kdjx/feedback {
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 204;
}

location ^~ /kdjx/internal/ {
    return 404;
}

location /kdjx/ {
    return 404;
}
