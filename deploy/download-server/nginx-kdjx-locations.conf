location = /games/kdjx/manifest.json {
    default_type application/json;
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ~ "^/games/kdjx/hot/(version|project)\.manifest$" {
    default_type application/json;
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /games/kdjx/hot/releases/ {
    default_type application/octet-stream;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable, no-transform" always;
    add_header Accept-Ranges "bytes" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ~ "^/games/kdjx/hot/[1-9][0-9]{0,8}/[A-Za-z0-9._@()/-]+$" {
    limit_except GET HEAD {
        deny all;
    }
    default_type application/octet-stream;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable, no-transform" always;
    add_header Accept-Ranges "bytes" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ~ "^/games/kdjx/kdjx-[0-9]+-[a-f0-9]{12}\.part-00[0-4]\.apk$" {
    default_type application/octet-stream;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable, no-transform" always;
    add_header Cloudflare-CDN-Cache-Control "public, max-age=31536000, immutable, no-transform" always;
    add_header Accept-Ranges "bytes" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ~ "^/games/kdjx/kdjx-[0-9]+-[a-f0-9]{12}\.apk$" {
    default_type application/vnd.android.package-archive;
    try_files $uri =404;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Accept-Ranges "bytes" always;
    add_header X-Content-Type-Options "nosniff" always;
}
