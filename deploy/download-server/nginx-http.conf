server {
    listen 80;
    listen [::]:80;
    server_name novel.kxhub.xyz;

    root /var/www/novel-download;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 200 "origin-ready\n";
    }
}
