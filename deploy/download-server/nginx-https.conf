server {
    listen 80;
    listen [::]:80;
    server_name novel.kxhub.xyz;

    root /var/www/novel-download;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name novel.kxhub.xyz;

    root /var/www/novel-download;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/novel.kxhub.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novel.kxhub.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:novel_download_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'" always;

    location = /games/modao/manifest.json {
        default_type application/json;
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ "^/games/modao/hot/(version|project)\.manifest$" {
        default_type application/json;
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /games/modao/hot/releases/ {
        default_type application/octet-stream;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform" always;
        add_header Accept-Ranges "bytes" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ "^/games/modao/modao-[0-9]+-[a-f0-9]{12}\.part-00[0-4]\.apk$" {
        default_type application/octet-stream;
        try_files $uri @download_not_found;
        # The helper creates five content-addressed objects below Cloudflare's
        # per-file cache ceiling. They are immutable and remain range-capable
        # so interrupted part downloads can resume without restarting.
        add_header Cache-Control "public, max-age=31536000, immutable, no-transform" always;
        add_header Cloudflare-CDN-Cache-Control "public, max-age=31536000, immutable, no-transform" always;
        add_header Accept-Ranges "bytes" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ "^/games/modao/modao-[0-9]+-[a-f0-9]{12}\.apk$" {
        default_type application/vnd.android.package-archive;
        try_files $uri @download_not_found;
        # The filename contains the verified content digest. Keep Range
        # requests available for Android DownloadManager resume support while
        # avoiding stale edge-cache shards for the multi-gigabyte game APK.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Accept-Ranges "bytes" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /app3/version.json {
        default_type application/json;
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ ^/app3/app-release-[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+\.apk$ {
        default_type application/vnd.android.package-archive;
        try_files $uri @download_not_found;
        # Cloudflare's segmented cache can leave one large Range shard at
        # very low throughput after the other parallel shards finish. Keep
        # versioned APKs immutable by filename, but stream Range requests
        # from the origin instead of caching the large object at the edge.
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Accept-Ranges "bytes" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /app3/app-release.apk {
        default_type application/vnd.android.package-archive;
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Accept-Ranges "bytes" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location @download_not_found {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 404;
    }

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
